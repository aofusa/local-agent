[package]
name = "cirka"
version = "0.1.0"
edition = "2024"
description = "CUI coding agent that uses a local-agent host (LangGraph + LM Studio) as its model"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
futures-util = "0.3.34"
globset = "0.4.20"
ignore = "0.4.33"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "io-std", "signal", "sync", "fs"] }
toml = "1.1.6"
unicode-width = "0.2.2"
uuid = { version = "1.27.0", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
