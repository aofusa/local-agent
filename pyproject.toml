[project]
name = "furry-ja-agent"
version = "0.1.0"
description = "LangGraph agent that drives a local ComfyUI + LM Studio furry_ja workflow"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "httpx>=0.27",
    "websockets>=13",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/furry_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "comfyui_nodes"]
